name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    name: فحص الوحدات واختبار الدورة
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: فحص بناء وحدات JS (node --check)
        run: |
          set -e
          for f in app/js/*.js; do
            node --check "$f"
            echo "✓ $f"
          done

      - name: اختبار الدخان المنطقي لدورة القيمة
        run: node app/test/smoke.mjs

      - name: التحقق من وجود ملفات المعمار
        run: |
          test -f docs/schema.sql && echo "✓ schema.sql موجود"
          test -f docs/architecture.md && echo "✓ architecture.md موجود"
          test -f app/index.html && echo "✓ index.html موجود"
